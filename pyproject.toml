[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "claudepilot"
version = "0.3.0.dev0"
description = "A tmux cockpit for Claude Code: live model, 5h/weekly limits, per-prompt model advice and git at a glance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Arif Suhan" }]
keywords = ["claude-code", "tmux", "cli", "developer-tools", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
claudepilot = "claudepilot.cli:app"
claudepilot-hook = "claudepilot.hooks.__main__:entry"

[tool.hatch.build.targets.wheel]
packages = ["src/claudepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option in defaults is the Typer idiom
